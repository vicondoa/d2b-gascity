name: Update generated inventory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.0
      - name: Install Nix
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: Reproduce generated inventory
        run: nix develop --no-write-lock-file --command make update-generated
      - name: Save generated patch
        run: |
          git diff --binary -- tests/generated/repository-inventory.json > repository-inventory.patch
      - name: Upload generated patch
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: repository-inventory.patch
          path: repository-inventory.patch
          if-no-files-found: error
      - name: Stop without mutating the default branch
        run: |
          echo "Apply the uploaded generated patch in a reviewed generated-only change."
          exit 1
