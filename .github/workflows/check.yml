name: Hermetic repository checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.0
      - name: Install Nix
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
            substituters = https://cache.nixos.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@42506e270a07908a6cb6f5ab7ba9b2e60056d6be
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 6442450944
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      - name: Preflight unprivileged user and network namespaces
        run: |
          set -euo pipefail
          unshare="$(command -v unshare || true)"
          ip="$(command -v ip || true)"
          if [ -z "$unshare" ] || [ -z "$ip" ]; then
            echo "::error::namespace preflight requires packaged or system unshare and ip commands; PATH=$PATH" >&2
            exit 1
          fi
          if ! "$unshare" --user --map-root-user --net "$ip" link set lo up; then
            echo "::error::unprivileged user or network namespaces are unavailable; enable CONFIG_USER_NS and allow unshare --user --net on this runner" >&2
            exit 1
          fi
      - run: nix develop --no-write-lock-file --command make check
        name: Run complete repository check
