[[rigs]]
name = "d2b"
prefix = "d2b"
default_branch = "v3"
suspended_on_start = true

[rigs.imports.roles]
source = "https://github.com/gastownhall/gascity-packs/tree/main/gascity/roles"
version = "sha:5d2a9d023edbb9ba24fdcff554e89fc3d7da72fe"

[providers.copilot-planning-sol]
base = "builtin:copilot"
command = "d2b-gascity-copilot-provider"
args = ["run"]
ready_delay_ms = 0
acp_command = "d2b-gascity-copilot-provider"
acp_args = ["run", "--profile", "planning-sol", "--tool-policy", "planning"]
path_check = "d2b-gascity-copilot-provider"
supports_acp = true

[providers.copilot-review]
base = "builtin:copilot"
command = "d2b-gascity-copilot-provider"
args = ["run"]
ready_delay_ms = 0
acp_command = "d2b-gascity-copilot-provider"
acp_args = ["run", "--profile", "review", "--tool-policy", "review"]
path_check = "d2b-gascity-copilot-provider"
supports_acp = true

[providers.copilot-review-sol]
base = "builtin:copilot"
command = "d2b-gascity-copilot-provider"
args = ["run"]
ready_delay_ms = 0
acp_command = "d2b-gascity-copilot-provider"
acp_args = ["run", "--profile", "review-sol", "--tool-policy", "review"]
path_check = "d2b-gascity-copilot-provider"
supports_acp = true

[providers.copilot-review-luna]
base = "builtin:copilot"
command = "d2b-gascity-copilot-provider"
args = ["run"]
ready_delay_ms = 0
acp_command = "d2b-gascity-copilot-provider"
acp_args = ["run", "--profile", "review-luna", "--tool-policy", "review"]
path_check = "d2b-gascity-copilot-provider"
supports_acp = true

[providers.copilot-code-luna]
base = "builtin:copilot"
command = "d2b-gascity-copilot-provider"
args = ["run"]
ready_delay_ms = 0
acp_command = "d2b-gascity-copilot-provider"
acp_args = ["run", "--profile", "code-luna", "--tool-policy", "coding"]
path_check = "d2b-gascity-copilot-provider"
supports_acp = true

[providers.publication-worker]
command = "d2b-gascity-publication-worker"
prompt_mode = "none"
ready_delay_ms = 0
path_check = "d2b-gascity-publication-worker"
supports_acp = false

[[patches.rigs]]
name = "d2b"
formula_vars = { base_branch = "v3", base_ref = "origin/v3" }

