include = ["model-tiers.toml"]

[session]
provider = "herdr"

[workspace]
provider = "deep-thinker"
global_fragments = [
  "command-glossary",
  "operational-awareness",
  "discord-v0",
  "d2b-governance",
]

[workspace.env]
GH_TOKEN = ""
GITHUB_TOKEN = ""

[providers]
[providers.deep-thinker]
base = "copilot-deep-sol"
[providers.deep-thinker.env]
GH_TOKEN = ""
GITHUB_TOKEN = ""

[providers.reviewer]
base = "copilot-review-grok"
[providers.reviewer.env]
GH_TOKEN = ""
GITHUB_TOKEN = ""

[providers.solid-worker]
base = "copilot-solid-luna"
[providers.solid-worker.env]
GH_TOKEN = ""
GITHUB_TOKEN = ""

[providers.fast-worker]
base = "copilot-fast-luna"
[providers.fast-worker.env]
GH_TOKEN = ""
GITHUB_TOKEN = ""

[providers.codex]
base = "builtin:codex"
ready_delay_ms = 0
[providers.codex.option_defaults]
model = ""
[providers.codex.env]
GH_TOKEN = ""
GITHUB_TOKEN = ""

[[patches.agent]]
dir = "d2b"
name = "gc.run-operator"

[patches.agent.env]
GH_TOKEN = "$GH_TOKEN"
GITHUB_TOKEN = ""
PR_BABYSIT_GITHUB_CAPABILITY_ATTESTED = "$PR_BABYSIT_GITHUB_CAPABILITY_ATTESTED"
PR_BABYSIT_VALIDATOR = "$PR_BABYSIT_VALIDATOR"
PR_BABYSIT_VALIDATOR_SHA256 = "$PR_BABYSIT_VALIDATOR_SHA256"
PR_BABYSIT_VALIDATOR_ATTESTED = "$PR_BABYSIT_VALIDATOR_ATTESTED"
PR_BABYSIT_VALIDATOR_TIMEOUT_SECONDS = "$PR_BABYSIT_VALIDATOR_TIMEOUT_SECONDS"

[[patches.agent]]
dir = "d2b"
name = "pr-babysit.pr-babysitter"

[patches.agent.env]
GH_TOKEN = ""
GITHUB_TOKEN = ""
PR_BABYSIT_GITHUB_CAPABILITY_ATTESTED = "$PR_BABYSIT_GITHUB_CAPABILITY_ATTESTED"
PR_BABYSIT_VALIDATOR = "$PR_BABYSIT_VALIDATOR"
PR_BABYSIT_VALIDATOR_SHA256 = "$PR_BABYSIT_VALIDATOR_SHA256"
PR_BABYSIT_VALIDATOR_ATTESTED = "$PR_BABYSIT_VALIDATOR_ATTESTED"
PR_BABYSIT_VALIDATOR_TIMEOUT_SECONDS = "$PR_BABYSIT_VALIDATOR_TIMEOUT_SECONDS"

[daemon]
patrol_interval = "30s"
max_restarts = 5
restart_window = "1h"
shutdown_timeout = "5s"
formula_v2 = true

[[named_session]]
template = "mayor"
scope = "city"
mode = "always"

[[rigs]]
name = "d2b"
prefix = "d2b"
default_branch = "v3"

[rigs.imports.gc]
source = "https://github.com/gastownhall/gascity-packs/tree/main/gascity/roles"
version = "sha:9f98ea4e1974cb49d18cd0c453eb81b2370cca84"

[rigs.imports.pr-babysit]
source = "../../packs/pr-babysit"

[rigs.formula_vars]
base_branch = "v3"
target_branch = "v3"
open_pr = "true"
push = "true"
drain_policy = "separate"

[[rigs]]
name = "city-source"
prefix = "city"
default_branch = "main"
suspended_on_start = true

[rigs.imports.gc]
source = "https://github.com/gastownhall/gascity-packs/tree/main/gascity/roles"
version = "sha:9f98ea4e1974cb49d18cd0c453eb81b2370cca84"

[rigs.imports.pr-babysit]
source = "../../packs/pr-babysit"

[rigs.formula_vars]
base_branch = "main"
target_branch = "main"
open_pr = "true"
push = "true"
drain_policy = "separate"
